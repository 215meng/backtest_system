[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantbacktest"
version = "0.1.0"
description = "Local, reproducible cryptocurrency factor research backtesting"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "plotly>=5.20",
  "typer>=0.12",
  "streamlit>=1.35",
  "scikit-learn>=1.4",
  "lightgbm>=4.0",
  "xgboost>=2.0",
  "mcp>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "nbformat>=5.10"]

[project.scripts]
quantbacktest = "quantbacktest.cli:app"
quantbacktest-mcp = "quantbacktest.mcp_server.server:main"

[tool.setuptools.packages.find]
include = ["quantbacktest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
