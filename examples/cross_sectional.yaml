name: top50_momentum_trace
data:
  adapter: crypto_top50
  path: data/raw/crypto_top50
  market: spot
  frequency: 1h
  symbols: [BTCUSDT, ETHUSDT, ADAUSDT, BNBUSDT, DOGEUSDT, DOTUSDT, LINKUSDT, LTCUSDT, SOLUSDT, XRPUSDT]
  start: 2024-01-01T00:00:00
  end: 2024-02-15T00:00:00
factor:
  module_path: examples/momentum_factor.py
  parameters:
    lookback_bars: 24
strategy:
  mode: cross_sectional
  selection: quantiles
  long_short: market_neutral
  quantiles: 2
  weighting: equal
  rebalance_bars: 1
  execution:
    holding_bars: 1
costs:
  fee_bps: 5
  slippage_bps: 2
debug:
  mode: trace
output:
  root: results/backtests
provenance:
  notes: 示例：24 小时动量截面因子
